{% extends "base.html" %}

{% block title %}
Dashboard | Connectify
{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-950">

    <nav class="border-b border-slate-800 bg-slate-900/80">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <div class="flex items-center gap-3">
                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-500 font-bold">
                    C
                </div>

                <span class="font-semibold">
                    Connectify
                </span>
            </div>

            <div class="flex items-center gap-4">

                <span class="hidden text-sm text-slate-400 sm:block">
                    {{ request.user.email }}
                </span>

                <form method="post" action="{% url 'authentication:logout' %}">
                    {% csrf_token %}

                    <button type="submit"
                        class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-red-500/50 hover:bg-red-500/10 hover:text-red-400">
                        Logout
                    </button>
                </form>

            </div>

        </div>
    </nav>


    <main class="mx-auto max-w-7xl px-6 py-12">

        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8">

            <p class="text-sm font-medium text-indigo-400">
                Welcome to Connectify
            </p>

            <h1 class="mt-2 text-3xl font-bold">
                Hello, {{ request.user.first_name }}.
            </h1>

            <p class="mt-3 text-slate-400">
                Your account has been created successfully.
            </p>

        </div>

    </main>

</div>

{% endblock %}
